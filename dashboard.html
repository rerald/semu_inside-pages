<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://skpvtqohyspfsmvwrgoc.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self';">
    <title>대시보드 - Quizbank</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/common.css">
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            background: #f8f9fa;
        }

        .welcome-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .welcome-content {
            flex: 1;
        }

        .welcome-section h2 {
            color: var(--dark-gray);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .welcome-section p {
            color: var(--medium-gray);
            font-size: 1.1rem;
        }

        .welcome-avatar {
            width: 120px;
            height: 120px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            border: 3px solid rgba(102, 126, 234, 0.2);
            overflow: hidden;
            margin-left: 30px;
        }

        .welcome-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .welcome-avatar.fallback {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-icon.exams {
            color: #667eea;
        }

        .stat-icon.completed {
            color: #28a745;
        }

        .stat-icon.pending {
            color: #ffc107;
        }

        .stat-icon.score {
            color: #17a2b8;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-gray);
            margin-bottom: 5px;
            transition: transform 0.2s ease-in-out;
        }

        .stat-label {
            color: var(--medium-gray);
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--dark-gray);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exam-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            cursor: pointer;
        }

        .exam-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .exam-score-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-badge {
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .score-badge.excellent {
            background: linear-gradient(135deg, #28a745, #20c997);
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.3);
        }

        .score-badge.good {
            background: linear-gradient(135deg, #17a2b8, #20c997);
            box-shadow: 0 2px 8px rgba(23, 162, 184, 0.3);
        }

        .score-badge.average {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
        }

        .score-badge.poor {
            background: linear-gradient(135deg, #dc3545, #e83e8c);
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }

        .score-detail {
            color: var(--medium-gray);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .exam-title {
            font-size: 1.3rem;
            color: var(--dark-gray);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .exam-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .exam-status.available {
            background: #d4edda;
            color: #155724;
        }

        .exam-status.completed {
            background: #cce7ff;
            color: #004085;
        }

        .exam-status.scheduled {
            background: #fff3cd;
            color: #856404;
        }

        .exam-description {
            color: var(--medium-gray);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .exam-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--medium-gray);
        }

        .exam-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .exam-meta .session-time {
            color: var(--primary-color);
            font-weight: 500;
        }

        .exam-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .quick-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            color: var(--dark-gray);
            transition: all 0.3s;
            font-weight: 500;
        }

        .quick-action-btn:hover {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
            transform: translateY(-1px);
        }

        .quick-action-btn i {
            font-size: 1.2rem;
        }

        /* 로딩 및 오류 상태 스타일 */
        .loading-exams {
            text-align: center;
            padding: 40px 20px;
            color: var(--medium-gray);
        }
        
        /* 마감 뱃지 스타일 */
        .deadline-badge { 
            display: inline-block; 
            margin-left: 8px; 
            padding: 2px 8px; 
            border-radius: 12px; 
            font-size: 12px; 
            vertical-align: middle; 
        }
        .deadline-badge.normal { background: #eef2ff; color: #3730a3; }
        .deadline-badge.warning { background: #fff7ed; color: #9a3412; }
        .deadline-badge.urgent { background: #fef2f2; color: #991b1b; }
        .deadline-badge.expired { background: #f3f4f6; color: #6b7280; text-decoration: line-through; }
        
        .loading-exams i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .loading-exams p {
            margin: 0;
            font-size: 1.1rem;
        }

        .no-exams {
            text-align: center;
            padding: 40px 20px;
            color: var(--medium-gray);
        }

        .no-exams i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #dee2e6;
        }

        .no-exams p {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        .no-exams small {
            color: #adb5bd;
        }

        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
        }

        .error-message i {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .error-message p {
            margin: 0;
            font-size: 1.1rem;
        }

        /* 시험 상태별 스타일 */
        .exam-status.completed {
            background-color: #28a745;
            color: white;
        }

        .exam-status.in-progress {
            background-color: #ffc107;
            color: #212529;
        }

        .exam-status.scheduled {
            background-color: #17a2b8;
            color: white;
        }

        .exam-status.expired {
            background-color: #6c757d;
            color: white;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .quick-actions {
                flex-direction: column;
            }
            
            .exam-meta {
                flex-direction: column;
                gap: 10px;
            }
            
            .exam-actions {
                justify-content: center;
            }
        }
    </style>
</head>

    <script>
        // 대시보드 페이지 전용 스크립트
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📊 대시보드 페이지 로드됨');
            
            // Supabase 클라이언트 초기화 확인
            let checkCount = 0;
            const maxChecks = 50; // 최대 5초 대기 (50 * 100ms)
            
            const checkSupabaseClient = () => {
                checkCount++;
                
                if (window.supabaseClient && window.semuApp) {
                    console.log('✅ Supabase 클라이언트와 semuApp 모두 확인됨');
                    
                    // 세션 복원이 완료될 때까지 추가 대기
                    if (!window.semuApp.currentUser) {
                        console.log('⏳ 세션 복원 대기 중...');
                        if (checkCount < maxChecks) {
                            setTimeout(checkSupabaseClient, 200);
                            return;
                        } else {
                            console.warn('⚠️ 세션 복원 타임아웃, 로그인 페이지로 이동');
                            // 리다이렉트 루프 방지를 위한 플래그 추가
                            window.location.href = './login.html?redirect_from=dashboard';
                            return;
                        }
                    }
                    
                    console.log('✅ 사용자 인증 확인됨:', window.semuApp.currentUser.email);
                
                    // 관리자도 사용자 대시보드 접근 허용
                    const user = window.semuApp.currentUser;
                    if (user.role === 'super_admin' || user.role === 'admin') {
                        console.log('✅ 관리자 계정이 사용자 대시보드에 접근했습니다:', user.email);
                        // 관리자도 일반 사용자처럼 대시보드를 사용할 수 있도록 허용
                    }
                
                // 사용자 정보 표시
                updateUserInfo();
                
                // 사용자 아바타 로드
                loadDashboardAvatar();
                
                // 통계 데이터 로드
                loadDashboardStats();
                    
                    // 시험 목록 로드
                    loadExamList();
                } else if (checkCount < maxChecks) {
                    console.log(`⏳ 초기화 대기 중... (${checkCount}/${maxChecks})`);
                    console.log('  - supabaseClient:', !!window.supabaseClient);
                    console.log('  - semuApp:', !!window.semuApp);
                    setTimeout(checkSupabaseClient, 100);
                } else {
                    console.error('❌ 초기화 실패 - 최대 대기 시간 초과');
                    document.getElementById('examList').innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>시스템 초기화에 실패했습니다. 페이지를 새로고침해주세요.</p>
                            <small>supabaseClient: ${!!window.supabaseClient}, semuApp: ${!!window.semuApp}</small>
                        </div>
                    `;
                }
            };
            
            // Supabase 클라이언트 확인 시작
            checkSupabaseClient();
        });

        function updateUserInfo() {
            const user = window.semuApp.currentUser;
            if (user) {
                document.getElementById('userName').textContent = user.name + '님';
                document.getElementById('welcomeMessage').textContent = 
                    `안녕하세요, ${user.name}님!`;
            }
        }

        async function loadDashboardAvatar() {
            try {
                console.log('🎭 대시보드 아바타 로드 시작');
                
                const userId = window.semuApp.currentUser.id;
                const avatarElement = document.getElementById('dashboardAvatar');
                
                if (!avatarElement) {
                    console.error('❌ 대시보드 아바타 요소를 찾을 수 없습니다');
                    return;
                }
                
                // 현재 착용한 아바타 조회 (is_active = true)
                const { data: activeAvatar, error: avatarError } = await window.semuApp.supabaseClient
                    .from('user_avatars')
                    .select(`
                        avatar_item_id,
                        avatar_items (
                            id,
                            name,
                            image_url,
                            description
                        )
                    `)
                    .eq('user_id', userId)
                    .eq('is_active', true)
                    .single();

                if (avatarError) {
                    console.log('⚠️ 착용한 아바타 없음 또는 오류:', avatarError);
                    setDashboardFallbackAvatar(avatarElement);
                    return;
                }

                if (activeAvatar && activeAvatar.avatar_items) {
                    console.log('✅ 착용한 아바타 발견:', activeAvatar.avatar_items);
                    setDashboardAvatarImage(avatarElement, activeAvatar.avatar_items);
                } else {
                    console.log('⚠️ 착용한 아바타 데이터 없음');
                    setDashboardFallbackAvatar(avatarElement);
                }

            } catch (error) {
                console.error('❌ 대시보드 아바타 로드 실패:', error);
                const avatarElement = document.getElementById('dashboardAvatar');
                if (avatarElement) {
                    setDashboardFallbackAvatar(avatarElement);
                }
            }
        }

        function setDashboardAvatarImage(avatarElement, avatarData) {
            // 기존 내용 제거
            avatarElement.innerHTML = '';
            avatarElement.classList.remove('fallback');
            
            // 아바타 이미지 생성
            const img = document.createElement('img');
            img.src = avatarData.image_url;
            img.alt = avatarData.name || '사용자 아바타';
            img.title = avatarData.description || avatarData.name || '사용자 아바타';
            
            // 이미지 로드 실패 시 폴백 처리
            img.onerror = () => {
                console.error('❌ 대시보드 아바타 이미지 로드 실패:', avatarData.image_url);
                setDashboardFallbackAvatar(avatarElement);
            };
            
            img.onload = () => {
                console.log('✅ 대시보드 아바타 이미지 로드 성공:', avatarData.name);
            };
            
            avatarElement.appendChild(img);
        }

        function setDashboardFallbackAvatar(avatarElement) {
            // 기존 내용 제거
            avatarElement.innerHTML = '';
            avatarElement.classList.add('fallback');
            
            // 사용자 이름의 첫 글자 표시
            const userName = window.semuApp.currentUser?.name || '사용자';
            const firstChar = userName.charAt(0).toUpperCase();
            avatarElement.textContent = firstChar;
            
            console.log('✅ 대시보드 폴백 아바타 설정됨:', firstChar);
        }

        async function loadDashboardStats() {
            try {
                console.log('📊 대시보드 통계 데이터 로딩 중...');
                
                // 현재 사용자 정보 가져오기
                const user = window.semuApp?.currentUser;
                if (!user) {
                    console.warn('⚠️ 사용자 정보가 없습니다.');
                    setDefaultStats();
                    return;
                }

                console.log('👤 통계 조회 사용자:', { id: user.id, email: user.email, role: user.role, department_id: user.department_id });

                // 1단계: 사용자가 응시 가능한 시험 ID들 조회
                let permissionsQuery;

                    console.log('👥 부서 권한 포함하여 조회');
                    permissionsQuery = window.supabaseClient
                        .from('exam_permissions')
                        .select('exam_id')
                        .or(`employee_id.eq.${user.id},department_id.eq.${user.department_id}`);
                } else {
                    // 부서 ID가 없는 경우: 개인 권한만

                    permissionsQuery = window.supabaseClient

                // 4단계: 통계 계산
                const totalExams = publishedExams?.length || 0;

                let completedExams = 0;

                publishedExams?.forEach((exam, index) => {

                console.log(`  totalScore: ${totalScore} (타입: ${typeof totalScore})`);
                console.log(`  scoredExams: ${scoredExams} (타입: ${typeof scoredExams})`);
                console.log(`  계산식: ${totalScore} / ${scoredExams} = ${totalScore / scoredExams}`);

        // 기본 통계값 설정
        function setDefaultStats() {

        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            if (!element) {
                console.warn(`⚠️ Element not found: ${elementId}`);
                return;
            }

            // 기존 애니메이션 정리
            if (element._timer) {
                clearInterval(element._timer);
                element._timer = null;
            }

            // 즉시 값 설정 (애니메이션 없이)
            element.textContent = targetNumber;
            
            console.log(`🎯 ${elementId} 업데이트: ${targetNumber}`);

            // 간단한 애니메이션 효과만 (값 변경 없이)
            element.style.transform = 'scale(1.1)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 200);
        }

        // 점수 정보 생성 함수
        function generateScoreInfo(userSession) {
            console.log('🎯 점수 정보 생성 시도:', { 
                userSession, 
                score: userSession?.score, 
                total_points: userSession?.total_points 
            });
            
            if (!userSession || userSession.score === null || !userSession.total_points) {
                console.log('❌ 점수 정보 생성 실패 - 데이터 부족');
                return '';
            }
            
            // score가 이미 백분율인 경우와 정답 개수인 경우를 구분
            let percentage, correctAnswers, displayScore;
            
            if (userSession.score > userSession.total_points) {
                // score가 백분율 (0-100)인 경우
                percentage = userSession.score;
                correctAnswers = Math.round((percentage / 100) * userSession.total_points);
                displayScore = `${percentage}점`;
            } else {
                // score가 정답 개수인 경우
                correctAnswers = userSession.score;
                percentage = Math.round((correctAnswers / userSession.total_points) * 100);
                displayScore = `${correctAnswers}점`;
            }
            
            let badgeClass = 'score-badge';
            
            if (percentage >= 90) badgeClass += ' excellent';
            else if (percentage >= 80) badgeClass += ' good';
            else if (percentage >= 60) badgeClass += ' average';
            else badgeClass += ' poor';
            
            console.log('✅ 점수 정보 생성 완료:', { 
                percentage, 
                correctAnswers, 
                total: userSession.total_points,
                displayScore 
            });
            
            return `
                <div class="exam-score-info">
                    <div class="${badgeClass}">${displayScore} (${percentage}%)</div>
                    <div class="score-detail">${correctAnswers}/${userSession.total_points} 정답</div>
                </div>
            `;
        }

        // 시험 목록 표시
        function displayExamList(permissions, user) {
            const examList = document.getElementById('examList');
            
            if (!permissions || permissions.length === 0) {
                examList.innerHTML = `
                    <div class="no-exams">
                        <i class="fas fa-clipboard-list"></i>
                        <p>응시 가능한 시험이 없습니다.</p>
                        <small>관리자에게 문의하세요.</small>
                    </div>
                `;
                return;
            }

            // 🎯 시험 정렬: 1) 미응시 시험 상단, 2) 최신순
            const sortedPermissions = permissions.sort((a, b) => {
                const aSession = a.exam_sessions?.find(s => s.employee_id === user.id);
                const bSession = b.exam_sessions?.find(s => s.employee_id === user.id);
                
                // 1순위: 미응시 시험 우선 (응시하지 않은 시험이 상단에)
                const aCompleted = aSession?.status === 'submitted';
                const bCompleted = bSession?.status === 'submitted';
                
                if (aCompleted !== bCompleted) {
                    return aCompleted ? 1 : -1; // 미응시(-1)가 응시완료(1)보다 우선
                }
                
                // 2순위: 최신순 정렬
                if (aCompleted && bCompleted) {
                    // 둘 다 완료된 경우: 응시 완료 시간 기준 최신순
                    const aSubmittedAt = new Date(aSession.submitted_at || aSession.created_at);
                    const bSubmittedAt = new Date(bSession.submitted_at || bSession.created_at);
                    return bSubmittedAt - aSubmittedAt; // 최신순 (내림차순)
                } else {
                    // 미응시인 경우: 시험 생성 시간 기준 최신순
                    const aDate = new Date(a.created_at);
                    const bDate = new Date(b.created_at);
                    return bDate - aDate; // 최신순 (내림차순)
                }
            });
            
            console.log('📊 정렬된 시험 목록:', sortedPermissions.map(exam => {
                const userSession = exam.exam_sessions?.find(s => s.employee_id === user.id);
                return {
                    title: exam.title,
                    id: exam.id.substring(0, 8),
                    completed: !!userSession && userSession.status === 'submitted',
                    created_at: exam.created_at,
                    submitted_at: userSession?.submitted_at,
                    sort_key: userSession?.status === 'submitted' 
                        ? userSession.submitted_at || userSession.created_at
                        : exam.created_at
                };
            }));

            const examsHtml = sortedPermissions.map(exam => {
                const questionCount = exam.exam_questions?.[0]?.count || 0;
                const userSession = exam.exam_sessions?.find(s => s.employee_id === user.id);
                
                // 시험 상태 결정
                let status = 'available';
                let statusText = '응시 가능';
                let statusClass = 'available';
                let buttonText = '시험 시작';
                let buttonClass = 'btn-primary';
                let buttonIcon = 'fas fa-play';
                let buttonAction = `startExam('${exam.id}')`;
                let scoreInfo = ''; // 점수 정보 추가

                if (userSession) {
                    if (userSession.status === 'graded') {
                        status = 'completed';
                        statusText = '완료';
                        statusClass = 'completed';
                        buttonText = '결과 보기';
                        buttonClass = 'btn-success';
                        buttonIcon = 'fas fa-eye';
                        buttonAction = `viewResult('${exam.id}')`;
                        scoreInfo = generateScoreInfo(userSession);
                    } else if (userSession.status === 'submitted') {
                        status = 'submitted';
                        statusText = '제출됨';
                        statusClass = 'submitted';
                        buttonText = '결과 보기';
                        buttonClass = 'btn-info';
                        buttonIcon = 'fas fa-eye';
                        buttonAction = `viewResult('${exam.id}')`;
                        scoreInfo = generateScoreInfo(userSession);
                    } else if (userSession.status === 'in_progress') {
                        status = 'in-progress';
                        statusText = '진행 중';
                        statusClass = 'in-progress';
                        buttonText = '계속하기';
                        buttonClass = 'btn-warning';
                        buttonIcon = 'fas fa-play';
                        buttonAction = `continueExam('${exam.id}')`;
                    }
                }

                // 시험 기간 체크
                const now = new Date();
                const startTime = exam.start_time ? new Date(exam.start_time) : null;
                const endTime = exam.end_time ? new Date(exam.end_time) : null;
                
                if (startTime && now < startTime) {
                    status = 'scheduled';
                    statusText = '예정됨';
                    statusClass = 'scheduled';
                    buttonText = '예약됨';
                    buttonClass = 'btn-secondary';
                    buttonIcon = 'fas fa-clock';
                    buttonAction = 'return false;';
                } else if (endTime && now > endTime) {
                    status = 'expired';
                    statusText = '종료됨';
                    statusClass = 'expired';
                    buttonText = '종료됨';
                    buttonClass = 'btn-secondary';
                    buttonIcon = 'fas fa-times';

        // 시험 시간 텍스트 생성
        function getExamTimeText(startTime, endTime) {
            const now = new Date();
            
            if (startTime && endTime) {
                if (now < startTime) {
                    return `시작: ${formatDate(startTime)}`;
                } else if (now > endTime) {
                    return `종료: ${formatDate(endTime)}`;
                } else {
                    return '진행 중';
                }
            } else if (startTime) {
                if (now < startTime) {
                    return `시작: ${formatDate(startTime)}`;
                } else {
                    return '언제든지';
                }
            } else {
                return '언제든지';
            }
        }
        
        // 마감 뱃지 생성
        function getDeadlineBadge(endTime) {
            if (!endTime) return '';
            const now = new Date();
            const end = new Date(endTime);
            if (isNaN(end.getTime())) return '';
            const diffMs = end - now;
            const info = formatRemaining(diffMs);
            const icon = diffMs >= 0 ? '<i class="fas fa-hourglass-half"></i>' : '<i class="fas fa-hourglass-end"></i>';
            const endText = formatDate(end);
            const label = diffMs >= 0 ? `${info.text} 남음` : `${info.text} 지남`;
            // 마감 시각을 뱃지 안에 함께 노출 (툴팁에도 유지)
            return `<span class="deadline-badge ${info.cls}" title="마감: ${endText}">${icon} 마감: ${endText} · ${label}</span>`;
        }
        
        // 남은 시간 포맷팅
        function formatRemaining(diffMs) {
            const abs = Math.abs(diffMs);
            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            let text = '';
            let cls = '';
            if (abs >= day) {
                const d = Math.floor(abs / day);
                text = `${d}일`;
            } else if (abs >= hour) {
                const h = Math.floor(abs / hour);
                text = `${h}시간`;
            } else {
                const m = Math.max(1, Math.floor(abs / minute));
                text = `${m}분`;
            }
            if (diffMs < 0) {
                cls = 'expired';
            } else if (abs <= hour) {
                cls = 'urgent';
            } else if (abs <= 24 * hour) {
                cls = 'warning';
            } else {
                cls = 'normal';
            }
            return { text, cls };
        }
        
        // 날짜 포맷팅
        function formatDate(date) {
            if (!date) return '';
            return new Intl.DateTimeFormat('ko-KR', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }).format(new Date(date));
        }

        // 응시 시간 텍스트 생성
        function getSessionTimeText(userSession) {
            if (!userSession) return '';
            
            let timeText = '';
            
            // 제출된 시험인 경우 제출 시간 표시
            if (userSession.submit_time) {
                timeText = `제출: ${formatSessionDate(userSession.submit_time)}`;
            }
            // 진행 중이거나 시작된 시험인 경우 시작 시간 표시
            else if (userSession.created_at) {
                timeText = `시작: ${formatSessionDate(userSession.created_at)}`;
            }
            
            return timeText;
        }

        // 응시 시간 상세 포맷팅
        function formatSessionDate(dateString) {
            if (!dateString) return '';
            
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            // 오늘 응시한 경우
            if (diffDays === 1) {
                return `오늘 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            }
            // 어제 응시한 경우
            else if (diffDays === 2) {
                return `어제 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
            }
            // 그 외의 경우
            else {
                return new Intl.DateTimeFormat('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }).format(date);
            }
        }

        // 난이도 텍스트 변환
        function getDifficultyText(difficulty) {
            const difficultyMap = {
                1: '매우 쉬움',
                2: '쉬움', 
                3: '보통',
                4: '어려움',
                5: '매우 어려움'
            };
            return difficultyMap[difficulty] || '보통';
        }

        // 문제별 랜덤화 정보 생성 함수

        // 보기 랜덤화 함수 (시험 보안 강화용)
        function randomizeQuestionChoices(question) {
            try {
                console.log('🔀 보기 랜덤화 시작:', question.id);
                
                // 보기가 없는 경우 원본 반환
                if (!question.choices || !Array.isArray(question.choices) || question.choices.length === 0) {
                    console.log('⚠️ 보기가 없어 랜덤화 건너뜀');
                    return {
                        randomizedChoices: question.choices || [],
                        originalToNewMapping: [],
                        newCorrectIndices: question.correct_answer_indices || [],
                        isRandomized: false
                    };
                }
                
                // 보기 배열 복사
                const choices = [...question.choices];
                const originalIndices = choices.map((_, index) => index);
                
                console.log('📋 원본 보기 순서:', originalIndices);
                console.log('📋 원본 정답 인덱스:', question.correct_answer_indices);
                
                // Fisher-Yates 셔플 알고리즘으로 랜덤화
                for (let i = choices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [choices[i], choices[j]] = [choices[j], choices[i]];
                    [originalIndices[i], originalIndices[j]] = [originalIndices[j], originalIndices[i]];
                }
                
                // 새로운 정답 인덱스 계산
                const newCorrectIndices = (question.correct_answer_indices || []).map(originalIndex => 
                    originalIndices.indexOf(originalIndex)
                );
                
                const result = {
                    randomizedChoices: choices,
                    originalToNewMapping: originalIndices,
                    newCorrectIndices: newCorrectIndices,
                    isRandomized: true
                };
                
                console.log('✅ 보기 랜덤화 완료:', {
                    newOrder: originalIndices,
                    newCorrectIndices: newCorrectIndices
                });
                
                return result;
                
            } catch (error) {
                console.error('❌ 보기 랜덤화 실패:', error);
                // 오류 발생 시 원본 반환
                return {
                    randomizedChoices: question.choices || [],
                    originalToNewMapping: [],
                    newCorrectIndices: question.correct_answer_indices || [],
                    isRandomized: false
                };
            }
        }
